# /etc/sw-inventory/allowlist.conf
# One extended regex per line, matched against the package NAME.
# Only these packages become node_software_info series (keep it ~10–30 entries).
# Kernel is tracked separately by node_kernel_* metrics.

# --- Core security ---
^openssl$
^libssl[0-9.]*(t64)?$
^openssl-libs$
^openssh-server$
^sudo$
^libc6$
^glibc$
^systemd$
^curl$
^ca-certificates$

# --- Container runtime / K8s ---
^containerd(\.io)?$
^runc$
^docker-ce$
^podman$
^cri-o$
^kubelet$
^kubeadm$
^kubectl$

# --- Proxy / LB ---
^nginx$
^haproxy$

# --- Databases ---
^mysql-server(-core)?(-[0-9.]+)?$
^mariadb-server$
^postgresql(-[0-9]+)?$
^postgresql[0-9]*-server$
^redis(-server)?$
